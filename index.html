<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RainPulse</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-color: #1a1a1e;
            --text-color: #ffffff;
            --text-secondary: #a0a0ab;
            --accent-blue: #38bdf8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-color);
            border-radius: 20px;
            padding: 25px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 { font-size: 1.5rem; margin-top: 0; text-align: center; color: var(--accent-blue); margin-bottom: 10px; }
        
        /* Slider Styling */
        .slider-container {
            margin: 15px 0 20px 0;
            background: rgba(255,255,255,0.02);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .slider-label span:last-child {
            color: var(--accent-blue);
            font-weight: bold;
        }
        .range-slider {
            width: 100%;
            -webkit-appearance: none;
            background: rgba(255,255,255,0.1);
            height: 6px;
            border-radius: 5px;
            outline: none;
        }
        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent-blue);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .range-slider::-webkit-slider-thumb:active {
            transform: scale(1.2);
        }

        .status-box {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            border-radius: 12px;
            background: rgba(255,255,255,0.03);
            font-size: 1.1rem;
        }
        .details {
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 15px;
            margin-top: 15px;
        }
        .detail-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }
        .detail-item span:first-child { color: var(--text-secondary); }
        .btn {
            width: 100%;
            background: var(--accent-blue);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn:active { opacity: 0.8; }
        .location-info {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 10px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="app-title">🌧️ RainPulse</h1>
    
    <div class="slider-container">
        <div class="slider-label">
            <span>Vorschau-Zeitraum:</span>
            <span id="slider-value">2 Stunden</span>
        </div>
        <input type="range" id="time-slider" class="range-slider" min="1" max="6" value="2" oninput="changeHours(this.value)">
    </div>

    <div id="status" class="status-box">Ortung wird gestartet...</div>
    
    <div id="details-container" class="details">
        <div class="detail-item"><span id="label-start">Zeitfenster von:</span> <span id="start-time">-</span></div>
        <div class="detail-item"><span id="label-end">Zeitfenster bis:</span> <span id="end-time">-</span></div>
        <div class="detail-item"><span id="label-duration">Status:</span> <span id="duration">-</span></div>
        <div class="detail-item"><span>Intensität (Max):</span> <span id="intensity">-</span></div>
    </div>

    <button class="btn" onclick="getWeather()">Jetzt aktualisieren</button>
    <div id="geo-info" class="location-info">Suche Standort-Signal...</div>
    <div id="update-info" class="location-info" style="color: #4ade80; font-weight: 500;"></div>
</div>

<script>
let updateInterval = null;
let countdownInterval = null;
let letztesWetterData = null;
let vorschauStunden = 2; // Standardmäßig 2 Stunden

function changeHours(val) {
    vorschauStunden = parseInt(val);
    document.getElementById('slider-value').innerText = vorschauStunden === 1 ? "1 Stunde" : `${vorschauStunden} Stunden`;
    document.getElementById('app-title').innerText = `🌧️ RainPulse (${vorschauStunden}h)`;
    
    // Wenn wir bereits Wetterdaten haben, berechnen wir die Anzeige sofort neu
    if (letztesWetterData) {
        analyzeHourlyRain();
    }
}

function getWeather() {
    const statusDiv = document.getElementById('status');
    const geoInfo = document.getElementById('geo-info');

    statusDiv.innerHTML = "🔄 Bestimme Standort...";

    if (!navigator.geolocation) {
        statusDiv.innerHTML = "❌ Ortung wird nicht unterstützt.";
        return;
    }

    navigator.geolocation.getCurrentPosition(
        (position) => {
            const lat = position.coords.latitude.toFixed(4);
            const lon = position.coords.longitude.toFixed(4);
            geoInfo.innerHTML = `📍 GPS: ${lat}, ${lon}`;
            
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=precipitation&timezone=auto&cb=${Date.now()}`;
            
            statusDiv.innerHTML = "📡 Lade Wetterdaten...";

            fetch(url)
                .then(res => {
                    if (!res.ok) throw new Error('API Fehler');
                    return res.json();
                })
                .then(data => {
                    letztesWetterData = data;
                    analyzeHourlyRain();
                    startLiveCountdown();

                    const jetzt = new Date();
                    const zeitStr = jetzt.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    document.getElementById('update-info').innerText = `🔄 Live-Update aktiv (Letzter Check: ${zeitStr})`;
                })
                .catch(err => {
                    statusDiv.innerHTML = "❌ Fehler beim Laden der Wetterdaten.";
                    console.error(err);
                });
        },
        (error) => {
            statusDiv.innerHTML = "❌ Ortung fehlgeschlagen.";
        },
        { enableHighAccuracy: false, timeout: 10000 }
    );
}

function analyzeHourlyRain() {
    const statusDiv = document.getElementById('status');
    const data = letztesWetterData;
    
    if (!data || !data.hourly || !data.hourly.precipitation) {
        statusDiv.innerHTML = "❌ Keine Daten empfangen.";
        return;
    }

    const jetzt = new Date();
    const aktuelleStunde = jetzt.getHours();
    const aktuelleMinute = jetzt.getMinutes();
    
    // Dynamisch alle Regenwerte für den gewählten Zeitraum sammeln
    let regenWerte = [];
    for (let i = 0; i <= vorschauStunden; i++) {
        regenWerte.push(data.hourly.precipitation[aktuelleStunde + i] || 0);
    }
    
    const maxRain = Math.max(...regenWerte);
    const formatUhrzeit = (dateObj) => dateObj.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + " Uhr";

    let startTimeStr = formatUhrzeit(jetzt);
    let zukunftSpaeter = new Date(jetzt.getTime() + vorschauStunden * 60 * 60 * 1000);
    let endTimeStr = formatUhrzeit(zukunftSpaeter);
    
    let durationStr = "";

    // Prüfen, wann genau im gewählten Zeitfenster der Regen startet/ist
    const rainNow = regenWerte[0] > 0;
    
    if (maxRain === 0) {
        statusDiv.innerHTML = `☀️ Trocken!<br><span style='font-size:0.9rem; color:#a0a0ab;'>Kein Regen in den nächsten ${vorschauStunden}h.</span>`;
        document.getElementById('label-start').innerText = "Zeitfenster von:";
        document.getElementById('label-end').innerText = "Zeitfenster bis:";
        document.getElementById('label-duration').innerText = "Status:";
        durationStr = "Alles trocken";
    } else if (rainNow) {
        statusDiv.innerHTML = "🌧️ Es regnet aktuell!";
        document.getElementById('label-start').innerText = "Zeitfenster von:";
        document.getElementById('label-duration').innerText = "Dauer im Fenster:";
        
        // Finden, wann es aufhört (erster Wert mit 0)
        let stopptNachStunden = regenWerte.findIndex(val => val === 0);
        
        if (stopptNachStunden === -1 || stopptNachStunden >= vorschauStunden) {
