<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RainRadar 2h</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-color: #1a1a1e;
            --text-color: #ffffff;
            --text-secondary: #a0a0ab;
            --accent-blue: #38bdf8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-color);
            border-radius: 20px;
            padding: 25px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 { font-size: 1.5rem; margin-top: 0; text-align: center; color: var(--accent-blue); }
        .status-box {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            border-radius: 12px;
            background: rgba(255,255,255,0.03);
            font-size: 1.1rem;
        }
        .details {
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 15px;
            margin-top: 15px;
        }
        .detail-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }
        .detail-item span:first-child { color: var(--text-secondary); }
        .btn {
            width: 100%;
            background: var(--accent-blue);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn:active { opacity: 0.8; }
        .location-info {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 10px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🌧️ Regen-Check (+/- 2h)</h1>
    <div id="status" class="status-box">Ortung wird gestartet...</div>
    
    <div id="details-container" class="details" style="display: none;">
        <div class="detail-item"><span id="label-start">Startet:</span> <span id="start-time">-</span></div>
        <div class="detail-item"><span id="label-end">Endet ca.:</span> <span id="end-time">-</span></div>
        <div class="detail-item"><span>Dauer im Fenster:</span> <span id="duration">-</span></div>
        <div class="detail-item"><span>Intensität:</span> <span id="intensity">-</span></div>
    </div>

    <button class="btn" onclick="getWeather()">Jetzt aktualisieren</button>
    <div id="geo-info" class="location-info">Suche Standort-Signal...</div>
    <div id="update-info" class="location-info" style="color: #4ade80; font-weight: 500;"></div>
</div>

<script>
let updateInterval = null;

function getWeather() {
    const statusDiv = document.getElementById('status');
    const geoInfo = document.getElementById('geo-info');
    const detailsContainer = document.getElementById('details-container');

    statusDiv.innerHTML = "🔄 Bestimme Standort...";
    detailsContainer.style.display = "none";

    if (!navigator.geolocation) {
        statusDiv.innerHTML = "❌ Ortung wird nicht unterstützt.";
        return;
    }

    navigator.geolocation.getCurrentPosition(
        (position) => {
            const lat = position.coords.latitude.toFixed(4);
            const lon = position.coords.longitude.toFixed(4);
            geoInfo.innerHTML = `📍 GPS: ${lat}, ${lon}`;
            
            // Trick gegen Server-Cache: Ein zufälliger Zeitstempel am Ende der URL (&cb=...) 
            // zwingt den Browser dazu, IMMER die brandneuesten Daten zu laden!
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&minutely_15=precipitation&timezone=auto&cb=${Date.now()}`;
            
            statusDiv.innerHTML = "📡 Lade Wetterdaten...";

            fetch(url)
                .then(res => {
                    if (!res.ok) throw new Error('API Fehler');
                    return res.json();
                })
                .then(data => {
                    analyzeMinutelyRain(data);
                    
                    const jetzt = new Date();
                    const zeitStr = jetzt.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    document.getElementById('update-info').innerText = `🔄 Live-Update aktiv (Letzter Check: ${zeitStr})`;
                })
                .catch(err => {
                    statusDiv.innerHTML = "❌ Fehler beim Laden der Wetterdaten.";
                    console.error(err);
                });
        },
        (error) => {
            statusDiv.innerHTML = "❌ Ortung fehlgeschlagen.";
        },
        { enableHighAccuracy: false, timeout: 10000 }
    );
}

function analyzeMinutelyRain(data) {
    const statusDiv = document.getElementById('status');
    const detailsContainer = document.getElementById('details-container');
    
    if (!data.minutely_15 || !data.minutely_15.precipitation) {
        statusDiv.innerHTML = "❌ Keine Minutendaten verfügbar.";
        return;
    }

    const times = data.minutely_15.time;
    const rain = data.minutely_15.precipitation;
    const jetzt = new Date();

    let rainStartIndex = -1;
    let rainEndIndex = -1;
    let maxIntensity = 0;
    
    // Wir prüfen die nächsten 2 Stunden (8 Intervalle à 15 Minuten)
    for (let i = 0; i < 8; i++) {
        const rainValue = rain[i] || 0;
        if (rainValue > 0) {
            if (rainStartIndex === -1) rainStartIndex = i;
            rainEndIndex = i;
            if (rainValue > maxIntensity) maxIntensity = rainValue;
        }
    }

    // Wenn absolut kein Regen in den nächsten 2 Stunden ansteht
    if (rainStartIndex === -1) {
        statusDiv.innerHTML = "☀️ Trocken!<br><span style='font-size:0.9rem; color:#a0a0ab;'>Kein Regen in den nächsten 2 Stunden.</span>";
        return;
    }

    const formatTime = (isoString) => {
        const d = new Date(isoString);
        return d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + " Uhr";
    };

    // Ob es JETZT im aktuellen 15-Minuten-Block regnet
    const isRainingNow = rain[0] > 0;

    if (isRainingNow) {
        statusDiv.innerHTML = "🌧️ Es regnet aktuell!";
        document.getElementById('label-start').innerText = "Regnet seit mindestens:";
        document.getElementById('label-end').innerText = "Hört vorerst auf um ca.:";
        
        document.getElementById('start-time').innerText = formatTime(times[0]);
        // Ende des Regenblocks (+15 Min auf die letzte Regenzeit rechnen)
        const endZeit = new Date(new Date(times[rainEndIndex]).getTime() + 15 * 60000);
        document.getElementById('end-time').innerText = endZeit.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + " Uhr";
        
        const verbleibendMs = endZeit - jetzt;
        const verbleibendMin = Math.max(1, Math.round(verbleibendMs / 60000));
        document.getElementById('duration').innerText = `${verbleibendMin} Min. verbleibend`;
    } else {
        statusDiv.innerHTML = "⏳ Regen in Sicht!<br><span style='font-size:0.9rem; color:#a0a0ab;'>Es fängt bald an.</span>";
        document.getElementById('label-start').innerText = "Startet um ca.:";
        document.getElementById('label-end').innerText = "Endet vorerst um ca.:";
        
        document.getElementById('start-time').innerText = formatTime(times[rainStartIndex]);
        const endZeit = new Date(new Date(times[rainEndIndex]).getTime() + 15 * 60000);
        document.getElementById('end-time').innerText = endZeit.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + " Uhr";
        
        const bisStartMs = new Date(times[rainStartIndex]) - jetzt;
        const bisStartMin = Math.max(1, Math.round(bisStartMs / 60000));
        document.getElementById('duration').innerText = `In ${bisStartMin} Min.`;
    }

    let intensityText = "Leicht";
    if (maxIntensity > 0.5) intensityText = "Mäßig";
    if (maxIntensity > 2.0) intensityText = "Stark";

    document.getElementById('intensity').innerText = `${maxIntensity.toFixed(1)} mm/h (${intensityText})`;
    detailsContainer.style.display = "block";
}

getWeather();

if (updateInterval) clearInterval(updateInterval);
updateInterval = setInterval(getWeather, 300000);
</script>

</body>
</html>
