<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RainRadar 2h</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-color: #1a1a1e;
            --text-color: #ffffff;
            --text-secondary: #a0a0ab;
            --accent-blue: #38bdf8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-color);
            border-radius: 20px;
            padding: 25px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 { font-size: 1.5rem; margin-top: 0; text-align: center; color: var(--accent-blue); }
        .status-box {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            border-radius: 12px;
            background: rgba(255,255,255,0.03);
            font-size: 1.1rem;
        }
        .details {
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 15px;
            margin-top: 15px;
        }
        .detail-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }
        .detail-item span:first-child { color: var(--text-secondary); }
        .btn {
            width: 100%;
            background: var(--accent-blue);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn:active { opacity: 0.8; }
        .location-info {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🌧️ Regen-Check (+/- 2h)</h1>
    <div id="status" class="status-box">Ortung wird gestartet...</div>
    
    <div id="details-container" class="details" style="display: none;">
        <div class="detail-item"><span>Startet um:</span> <span id="start-time">-</span></div>
        <div class="detail-item"><span>Endet um:</span> <span id="end-time">-</span></div>
        <div class="detail-item"><span>Dauer:</span> <span id="duration">-</span></div>
        <div class="detail-item"><span>Intensität:</span> <span id="intensity">-</span></div>
    </div>

    <button class="btn" onclick="getWeather()">Jetzt aktualisieren</button>
    <div id="geo-info" class="location-info">Suche GPS-Signal...</div>
</div>

<script>
function getWeather() {
    const statusDiv = document.getElementById('status');
    const geoInfo = document.getElementById('geo-info');
    const detailsContainer = document.getElementById('details-container');

    statusDiv.innerHTML = "🔄 Bestimme Standort...";
    detailsContainer.style.display = "none";

    if (!navigator.geolocation) {
        statusDiv.innerHTML = "❌ GPS wird von deinem Browser nicht unterstützt.";
        return;
    }

    // GPS-Standort abfragen
    navigator.geolocation.getCurrentPosition(
        (position) => {
            const lat = position.coords.latitude.toFixed(4);
            const lon = position.coords.longitude.toFixed(4);
            geoInfo.innerHTML = `📍 GPS: ${lat}, ${lon}`;
            
            // Open-Meteo API mit minütlichen Daten aufrufen
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&minutely_15=&timezone=auto`;
            
            statusDiv.innerHTML = "📡 Lade Wetterdaten...";

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    analyzeRain(data);
                })
                .catch(err => {
                    statusDiv.innerHTML = "❌ Fehler beim Laden der Wetterdaten.";
                    console.error(err);
                });
        },
        (error) => {
            statusDiv.innerHTML = "❌ GPS-Zugriff verweigert oder fehlgeschlagen.";
            geoInfo.innerHTML = "Bitte aktiviere GPS auf deinem Handy.";
        },
        { enableHighAccuracy: true, timeout: 10000 }
    );
}

function analyzeRain(data) {
    const statusDiv = document.getElementById('status');
    const detailsContainer = document.getElementById('details-container');
    
    // Open-Meteo liefert 15-Minuten-Schritte für die nächsten Stunden
    const times = data.minutely_15.time; 
    const rain = data.minutely_15.rain || data.minutely_15.precipitation; // Niederschlag in mm

    let rainStartIndex = -1;
    let rainEndIndex = -1;
    let maxIntensity = 0;
    let isRainingNow = rain[0] > 0;

    // Wir schauen uns die nächsten 8 Intervalle an (8 * 15 Min = 2 Stunden)
    for (let i = 0; i < 8; i++) {
        if (rain[i] > 0) {
            if (rainStartIndex === -1) rainStartIndex = i;
            rainEndIndex = i;
            if (rain[i] > maxIntensity) maxIntensity = rain[i];
        }
    }

    if (rainStartIndex === -1) {
        statusDiv.innerHTML = "☀️ Trocken!<br><span style='font-size:0.9rem; color:#a0a0ab;'>Kein Regen in den nächsten 2 Stunden.</span>";
        return;
    }

    // Zeiten formatieren
    const formatTime = (isoString) => {
        const d = new Date(isoString);
        return d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    };

    const startTimeStr = formatTime(times[rainStartIndex]);
    const endTimeStr = formatTime(new Date(new Date(times[rainEndIndex]).getTime() + 15 * 60000)); // +15 Minuten fürs Ende des Intervalls
    const durationMin = (rainEndIndex - rainStartIndex + 1) * 15;

    // Intensität beschreiben
    let intensityText = "Leicht";
    if (maxIntensity > 0.5) intensityText = "Mäßig";
    if (maxIntensity > 2.0) intensityText = "Stark";

    // Hauptstatus setzen
    if (isRainingNow) {
        statusDiv.innerHTML = "🌧️ Es regnet aktuell!";
    } else {
        const diffMs = new Date(times[rainStartIndex]) - new Date();
        const diffMin = Math.max(0, Math.round(diffMs / 60000));
        statusDiv.innerHTML = `⏳ Regen in Sicht!<br><span style='font-size:0.9rem; color:#a0a0ab;'>Beginnt in ca. ${diffMin} Minuten.</span>`;
    }

    // Details befüllen
    document.getElementById('start-time').innerText = startTimeStr;
    document.getElementById('end-time').innerText = endTimeStr;
    document.getElementById('duration').innerText = `${durationMin} Min.`;
    document.getElementById('intensity').innerText = `${maxIntensity.toFixed(1)} mm/h (${intensityText})`;
    
    detailsContainer.style.display = "block";
}

// Direkt beim Start einmal ausführen
getWeather();
</script>

</body>
</html>
