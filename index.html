<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RegenCheck</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #121214;
            --card-color: #1a1a1e;
            --text-color: #ffffff;
            --text-secondary: #a0a0ab;
            --accent-blue: #38bdf8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-color);
            border-radius: 20px;
            padding: 25px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 { font-size: 1.5rem; margin-top: 0; text-align: center; color: var(--accent-blue); margin-bottom: 2px; }
        
        .time-window-sub {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .slider-container {
            margin: 15px 0 20px 0;
            background: rgba(255,255,255,0.02);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .slider-label span:last-child {
            color: var(--accent-blue);
            font-weight: bold;
        }
        .range-slider {
            width: 100%;
            -webkit-appearance: none;
            background: rgba(255,255,255,0.1);
            height: 6px;
            border-radius: 5px;
            outline: none;
        }
        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent-blue);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .range-slider::-webkit-slider-thumb:active {
            transform: scale(1.2);
        }

        .status-box {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            border-radius: 12px;
            background: rgba(255,255,255,0.03);
            font-size: 1.1rem;
        }
        .details {
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 15px;
            margin-top: 15px;
        }
        .detail-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }
        .detail-item span:first-child { color: var(--text-secondary); }
        
        .btn {
            width: 100%;
            background: var(--accent-blue);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn:active { opacity: 0.8; }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-secondary:active { background: rgba(255, 255, 255, 0.15); }

        .location-info {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 10px;
            line-height: 1.4;
        }

        #chart-view {
            display: none;
            margin-top: 15px;
        }
        .chart-container {
            position: relative;
            width: 100%;
            height: 200px;
            background: rgba(255,255,255,0.02);
            padding: 10px;
            border-radius: 12px;
            box-sizing: border-box;
            border: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="app-title">🌧️ RegenCheck (2h)</h1>
    <div id="time-window-display" class="time-window-sub">Zeitfenster: --:-- - --:-- Uhr</div>
    
    <div class="slider-container">
        <div class="slider-label">
            <span>Vorschau-Zeitraum:</span>
            <span id="slider-value">2 Stunden</span>
        </div>
        <input type="range" id="time-slider" class="range-slider" min="1" max="6" value="2" oninput="changeHours(this.value)">
    </div>

    <div id="main-view">
        <div id="status" class="status-box">Ortung wird gestartet...</div>
        
        <div id="details-container" class="details">
            <div class="detail-item"><span id="label-duration">Status:</span> <span id="duration">-</span></div>
            <div class="detail-item"><span>Intensität:</span> <span id="intensity">-</span></div>
            <div class="detail-item"><span>Niederschlagsart:</span> <span id="rain-type">-</span></div>
        </div>
        
        <button class="btn btn-secondary" id="toggle-chart-btn" onclick="showChart(true)">📊 Diagramm anzeigen</button>
    </div>

    <div id="chart-view">
        <div class="chart-container">
            <canvas id="rainChart"></canvas>
        </div>
        <button class="btn btn-secondary" onclick="showChart(false)">⬅️ Zurück zur Übersicht</button>
    </div>

    <button class="btn" onclick="getWeather()">Jetzt aktualisieren</button>
    <div id="geo-info" class="location-info">Suche Standort-Signal...</div>
    <div id="update-info" class="location-info" style="color: #4ade80; font-weight: 500;"></div>
</div>

<script>
let updateInterval = null;
let countdownInterval = null;
let letztesWetterData = null;
let vorschauStunden = 2;
let myChart = null;

function changeHours(val) {
    vorschauStunden = parseInt(val);
    document.getElementById('slider-value').innerText = vorschauStunden === 1 ? "1 Stunde" : `${vorschauStunden} Stunden`;
    document.getElementById('app-title').innerText = `🌧️ RegenCheck (${vorschauStunden}h)`;
    
    if (letztesWetterData) {
        analyzeHourlyRain();
    }
}

function showChart(visible) {
    document.getElementById('main-view').style.display = visible ? 'none' : 'block';
    document.getElementById('chart-view').style.display = visible ? 'block' : 'none';
    if (visible && letztesWetterData) {
        buildChart();
    }
}

function getWeather() {
    const statusDiv = document.getElementById('status');
    const geoInfo = document.getElementById('geo-info');

    statusDiv.innerHTML = "🔄 Bestimme Standort...";

    if (!navigator.geolocation) {
        statusDiv.innerHTML = "❌ Ortung wird nicht unterstützt.";
        return;
    }

    navigator.geolocation.getCurrentPosition(
        (position) => {
            const lat = position.coords.latitude.toFixed(4);
            const lon = position.coords.longitude.toFixed(4);
            
            geoInfo.innerHTML = `📍 GPS: ${lat}, ${lon}`;
            
            const geoCodingUrl = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=14&addressdetails=1`;
            
            fetch(geoCodingUrl, { headers: { 'Accept-Language': 'de' } })
                .then(res => res.json())
                .then(geoData => {
                    if (geoData && geoData.address) {
                        const addr = geoData.address;
                        const stadt = addr.city || addr.town || addr.village || addr.suburb || "Unbekannter Ort";
                        const viertel = addr.suburb || addr.neighbourhood || addr.road || "";
                        
                        geoInfo.innerHTML = viertel ? `📍 ${stadt} (${viertel})` : `📍 ${stadt}`;
                    }
                })
                .catch(err => console.error("Geocoding Fehler:", err));
            
            const url = `https://46-225-101-203.sslip.io:5000/api/regen?lat=${lat}&lon=${lon}&cb=${Date.now()}`;
            
            statusDiv.innerHTML = "📡 Lade DWD-Wetterdaten...";

            fetch(url)
                .then(res => {
                    if (!res.ok) throw new Error('API Fehler');
                    return res.json();
                })
                .then(data => {
                    letztesWetterData = data;
                    analyzeHourlyRain();
                    startLiveCountdown();

                    const jetzt = new Date();
                    const zeitStr = jetzt.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    document.getElementById('update-info').innerText = `🔄 Live-Update aktiv (Letzter Check: ${zeitStr})`;
                })
                .catch(err => {
                    statusDiv.innerHTML = "❌ Fehler beim Laden der Wetterdaten.";
                    console.error(err);
                });
        },
        (error) => {
            statusDiv.innerHTML = "❌ Ortung fehlgeschlagen.";
        },
        { enableHighAccuracy: true, timeout: 10000 }
    );
}

function formatMinutenSchoen(gesamtMinuten) {
    if (gesamtMinuten < 60) return `${gesamtMinuten} Min.`;
    const stunden = Math.floor(gesamtMinuten / 60);
    const minuten = gesamtMinuten % 60;
    return minuten === 0 ? `${stunden} Std.` : `${stunden} Std. ${minuten} Min.`;
}

function analyzeHourlyRain() {
    const statusDiv = document.getElementById('status');
    const data = letztesWetterData;
    
    if (!data) {
        statusDiv.innerHTML = "❌ Keine Daten empfangen.";
        return;
    }

    const jetzt = new Date();
    const formatUhrzeitKompakt = (dateObj) => dateObj.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    
    let startTimeStr = formatUhrzeitKompakt(jetzt);
    let zukunftSpaeter = new Date(jetzt.getTime() + vorschauStunden * 60 * 60 * 1000);
    let endTimeStr = formatUhrzeitKompakt(zukunftSpaeter);
    
    document.getElementById('time-window-display').innerText = `Zeitfenster: ${startTimeStr} - ${endTimeStr} Uhr`;
    
    let durationStr = "";
    let typeText = "Kein Niederschlag";
    let aktuelleIntensitaet = 0.0;

    if (data.high_precision && data.high_precision.rain_now) {
        statusDiv.innerHTML = `🌧️ Es regnet jetzt!`;
        document.getElementById('label-duration').innerText = "Status:";
        durationStr = "Akuter Niederschlag";
        typeText = "DWD Live-Radar 📡";
        aktuelleIntensitaet = data.high_precision.current_intensity;
    } else if (data.high_precision && data.high_precision.minuten_bis_regen > 0) {
        const minuten = data.high_precision.minuten_bis_regen;
        statusDiv.innerHTML = `⏳ Niederschlag in ${minuten} Min.!<br><span style='font-size:0.85rem; color:#a0a0ab;'>DWD 5-Minuten-Radarprognose.</span>`;
        document.getElementById('label-duration').innerText = "Startet in:";
        durationStr = formatMinutenSchoen(minuten);
        typeText = "Anziehende Front 🌧️";
        aktuelleIntensitaet = data.high_precision.current_intensity || 0.1;
    } else {
        let maxRain = 0;
        if (data.hourly && data.hourly.precipitation) {
            const aktuelleStunde = jetzt.getHours();
            let vorschauWerte = data.hourly.precipitation.slice(aktuelleStunde, aktuelleStunde + vorschauStunden + 1);
            maxRain = Math.max(...vorschauWerte, 0);
        }

        if (maxRain === 0) {
            statusDiv.innerHTML = `☀️ Trocken!<br><span style='font-size:0.85rem; color:#a0a0ab;'>Kein Regen in den nächsten ${vorschauStunden}h.</span>`;
            document.getElementById('label-duration').innerText = "Status:";
            durationStr = "Alles trocken";
            typeText = "Kein Niederschlag";
            aktuelleIntensitaet = 0.0;
        } else {
            statusDiv.innerHTML = `⏳ Niederschlag in Sicht!<br><span style='font-size:0.85rem; color:#a0a0ab;'>Modell meldet späteren Regen.</span>`;
            document.getElementById('label-duration').innerText = "Startet in:";
            durationStr = "Später am Tag";
            typeText = "Wettermodell-Prognose";
            aktuelleIntensitaet = maxRain;
        }
    }

    let intensityText = "Keiner";
    if (aktuelleIntensitaet > 0 && aktuelleIntensitaet <= 0.5) intensityText = "Leicht";
    if (aktuelleIntensitaet > 0.5 && aktuelleIntensitaet <= 2.0) intensityText = "Mäßig";
    if (aktuelleIntensitaet > 2.0) intensityText = "Stark";

    document.getElementById('duration').innerText = durationStr;
    document.getElementById('intensity').innerText = `${aktuelleIntensitaet.toFixed(1)} mm/h (${intensityText})`;
    document.getElementById('rain-type').innerText = typeText;

    if (document.getElementById('chart-view').style.display === 'block') {
        buildChart();
    }
}

function buildChart() {
    const ctx = document.getElementById('rainChart').getContext('2d');
    const jetzt = new Date();
    
    let labels = [];
    let daten = [];
    
    // Erkennt automatisch, wie die 5-Minuten-Struktur im API-Paket heißt
    let prognoseListe = null;
    if (letztesWetterData && letztesWetterData.high_precision) {
        prognoseListe = letztesWetterData.high_precision.forecast_5min || 
                        letztesWetterData.high_precision.forecast_5m || 
                        letztesWetterData.high_precision.radar_5min;
    }
    
    // INTELLIGENTE WEICHE
    if (vorschauStunden <= 2 && prognoseListe && Array.isArray(prognoseListe) && prognoseListe.length > 0) {
        // HOCHAUFLÖSENDER MODUS (5-Minuten-Radar)
        const maxPunkte = vorschauStunden * 12; 
        const relevantePunkte = prognoseListe.slice(0, maxPunkte + 1);
        
        relevantePunkte.forEach(punkt => {
            const tempDate = new Date(punkt.timestamp * 1000);
            const zeitString = tempDate.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            labels.push(zeitString);
            daten.push(punkt.precipitation);
        });
    } else {
        // ÜBERBLICKS-MODUS (Stündliche Modellwerte)
        const aktuelleStunde = jetzt.getHours();
        for (let i = 0; i <= vorschauStunden; i++) {
            let std = (aktuelleStunde + i) % 24;
            labels.push(`${std.toString().padStart(2, '0')}:00`);
            daten.push(letztesWetterData.hourly && letztesWetterData.hourly.precipitation ? (letztesWetterData.hourly.precipitation[aktuelleStunde + i] || 0) : 0);
        }
    }
    
    if (myChart) {
        myChart.destroy();
    }
    
    myChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Niederschlag (mm/h)',
                data: daten,
                borderColor: '#38bdf8',
                backgroundColor: 'rgba(56, 189, 248, 0.15)',
                fill: true,
                tension: 0.3,
                borderWidth: 2,
                pointRadius: vorschauStunden <= 2 ? 0 : 3, // Blendet die dicken Punkte bei 5-Min aus, damit die Linie clean bleibt
                pointBackgroundColor: '#38bdf8'
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: {
                    grid: { display: false },
                    ticks: { 
                        color: '#a0a0ab', 
                        font: { size: 10 },
                        maxTicksLimit: vorschauStunden <= 2 ? 5 : 7 
                    }
                },
                y: {
                    beginAtZero: true,
                    grid: { color: 'rgba(255, 255, 255, 0.05)' },
                    ticks: { 
                        color: '#a0a0ab', 
                        font: { size: 10 },
                        callback: function(value) { return value.toFixed(1) + ' mm'; }
                    }
                }
            }
        }
    });
}

function startLiveCountdown() {
    if (countdownInterval) clearInterval(countdownInterval);
    countdownInterval = setInterval(() => {
        if (letztesWetterData) {
            analyzeHourlyRain();
        }
    }, 10000); 
}

window.addEventListener('DOMContentLoaded', () => {
    getWeather();
    if (updateInterval) clearInterval(updateInterval);
    updateInterval = setInterval(getWeather, 300000); 
});
</script>

</body>
</html>
