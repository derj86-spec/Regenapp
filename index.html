<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RegenCheck</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #121214;
            --card-color: #1a1a1e;
            --text-color: #ffffff;
            --text-secondary: #a0a0ab;
            --accent-blue: #38bdf8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-color);
            border-radius: 20px;
            padding: 25px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 { font-size: 1.5rem; margin-top: 0; text-align: center; color: var(--accent-blue); margin-bottom: 15px; }
        .status-box { text-align: center; margin: 20px 0; padding: 15px; border-radius: 12px; background: rgba(255,255,255,0.03); font-size: 1.1rem; font-weight: bold; }
        .details { border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; margin-top: 15px; }
        .detail-item { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.95rem; }
        .detail-item span:first-child { color: var(--text-secondary); }
        .btn { width: 100%; background: var(--accent-blue); color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .location-info { font-size: 0.75rem; color: var(--text-secondary); text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1 id="app-title">🌧️ RegenCheck (Radar)</h1>
    
    <div id="main-view">
        <div id="status" class="status-box">Ortung wird gestartet...</div>
        <div class="details">
            <div class="detail-item"><span id="label-duration">Status:</span> <span id="duration">-</span></div>
            <div class="detail-item"><span>Intensität:</span> <span id="intensity">-</span></div>
            <div class="detail-item"><span>Art:</span> <span id="precipitation-type" style="color:var(--accent-blue)">-</span></div>
        </div>
    </div>

    <button class="btn" onclick="initLocation(true)">🔄 Jetzt aktualisieren</button>
    <div id="geo-info" class="location-info">Standort wird ermittelt...</div>
    <div id="update-info" class="location-info" style="color: #4ade80; margin-top: 5px;">-</div>
</div>

<script>
let savedLat = null, savedLon = null;

function initLocation(forceGPSRefresh = false) {
    if (savedLat && savedLon && !forceGPSRefresh) {
        getWeatherData();
    } else {
        navigator.geolocation.getCurrentPosition((pos) => {
            savedLat = pos.coords.latitude.toFixed(4);
            savedLon = pos.coords.longitude.toFixed(4);
            getWeatherData();
        }, () => {
            document.getElementById('status').innerText = "Standort-Zugriff nötig.";
        }, { enableHighAccuracy: true });
    }
}

function getWeatherData() {
    if (!savedLat || !savedLon) return;

    fetch(`https://46-225-101-203.sslip.io/api/regen?lat=${savedLat}&lon=${savedLon}&cb=${Date.now()}`)
        .then(res => res.json())
        .then(data => {
            const hp = data.high_precision;
            const statusEl = document.getElementById('status');
            const durEl = document.getElementById('duration');
            const intEl = document.getElementById('intensity');
            const typeEl = document.getElementById('precipitation-type');

            if (hp.rain_now) {
                statusEl.innerHTML = "🌧️ Es regnet aktuell";
                durEl.innerText = "Akut";
                intEl.innerText = `${hp.current_intensity.toFixed(1)} mm/h`;
                typeEl.innerText = hp.niederschlags_art;
            } else if (hp.minuten_bis_regen >= 0) {
                statusEl.innerHTML = `⏳ Regen in ${hp.minuten_bis_regen} Min.`;
                const arrivalTime = new Date(Date.now() + hp.minuten_bis_regen * 60000);
                durEl.innerText = arrivalTime.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'}) + " Uhr";
                intEl.innerText = "-";
                typeEl.innerText = "Prognose";
            } else {
                statusEl.innerHTML = "☀️ Alles trocken";
                durEl.innerText = "Kein Regen in Sicht";
                intEl.innerText = "-";
                typeEl.innerText = "-";
            }
            
            document.getElementById('update-info').innerText = `Stand: ${new Date().toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'})} Uhr`;
        })
        .catch(err => document.getElementById('status').innerText = "Verbindungsfehler");
}

window.addEventListener('DOMContentLoaded', () => initLocation(false));
setInterval(getWeatherData, 60000);
</script>
</body>
</html>
