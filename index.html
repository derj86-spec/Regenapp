<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RainRadar 2h</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-color: #1a1a1e;
            --text-color: #ffffff;
            --text-secondary: #a0a0ab;
            --accent-blue: #38bdf8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-color);
            border-radius: 20px;
            padding: 25px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 { font-size: 1.5rem; margin-top: 0; text-align: center; color: var(--accent-blue); }
        .status-box {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            border-radius: 12px;
            background: rgba(255,255,255,0.03);
            font-size: 1.1rem;
        }
        .details {
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 15px;
            margin-top: 15px;
        }
        .detail-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }
        .detail-item span:first-child { color: var(--text-secondary); }
        .btn {
            width: 100%;
            background: var(--accent-blue);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn:active { opacity: 0.8; }
        .location-info {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🌧️ Regen-Check (+/- 2h)</h1>
    <div id="status" class="status-box">Ortung wird gestartet...</div>
    
    <div id="details-container" class="details" style="display: none;">
        <div class="detail-item"><span>Zeitraum:</span> <span id="time-window">-</span></div>
        <div class="detail-item"><span>Niederschlag:</span> <span id="rain-amount">-</span></div>
        <div class="detail-item"><span>Intensität:</span> <span id="intensity">-</span></div>
    </div>

    <button class="btn" onclick="getWeather()">Jetzt aktualisieren</button>
    <div id="geo-info" class="location-info">Suche Standort-Signal...</div>
</div>

<script>
function getWeather() {
    const statusDiv = document.getElementById('status');
    const geoInfo = document.getElementById('geo-info');
    const detailsContainer = document.getElementById('details-container');

    statusDiv.innerHTML = "🔄 Bestimme Standort...";
    detailsContainer.style.display = "none";

    if (!navigator.geolocation) {
        statusDiv.innerHTML = "❌ Ortung wird nicht unterstützt.";
        return;
    }

    navigator.geolocation.getCurrentPosition(
        (position) => {
            const lat = position.coords.latitude.toFixed(4);
            const lon = position.coords.longitude.toFixed(4);
            geoInfo.innerHTML = `📍 GPS: ${lat}, ${lon}`;
            
            // Nutzt die stabilere Hourly-API
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=precipitation&timezone=auto`;
            
            statusDiv.innerHTML = "📡 Lade Wetterdaten...";

            fetch(url)
                .then(res => {
                    if (!res.ok) throw new Error('API Fehler');
                    return res.json();
                })
                .then(data => {
                    analyzeHourlyRain(data);
                })
                .catch(err => {
                    statusDiv.innerHTML = "❌ Fehler beim Laden der Wetterdaten.";
                    console.error(err);
                });
        },
        (error) => {
            statusDiv.innerHTML = "❌ Ortung fehlgeschlagen.";
        },
        { enableHighAccuracy: false, timeout: 10000 }
    );
}

function analyzeHourlyRain(data) {
    const statusDiv = document.getElementById('status');
    const detailsContainer = document.getElementById('details-container');
    
    if (!data.hourly || !data.hourly.precipitation) {
        statusDiv.innerHTML = "❌ Keine Daten empfangen.";
        return;
    }

    // Aktuelle Stunde finden
    const jetzt = new Date();
    const aktuelleStunde = jetzt.getHours();
    
    // Wir holen uns die Daten für die aktuelle Stunde und die nächste Stunde (+2h Fenster)
    const rainNow = data.hourly.precipitation[aktuelleStunde] || 0;
    const rainNext = data.hourly.precipitation[aktuelleStunde + 1] || 0;
    
    const maxRain = Math.max(rainNow, rainNext);

    // Zeitfenster-Text bauen
    const vonZeit = `${String(aktuelleStunde).padStart(2, '0')}:00`;
    const bisZeit = `${String(aktuelleStunde + 2).padStart(2, '0')}:00`;

    if (maxRain === 0) {
        statusDiv.innerHTML = "☀️ Trocken!<br><span style='font-size:0.9rem; color:#a0a0ab;'>Kein Regen in den nächsten 2 Stunden.</span>";
        return;
    }

    // Status-Text bestimmen
    if (rainNow > 0) {
        statusDiv.innerHTML = "🌧️ Es regnet aktuell!";
    } else {
        statusDiv.innerHTML = "⏳ Regen in Sicht!<br><span style='font-size:0.9rem; color:#a0a0ab;'>Es fängt in der nächsten Stunde an.</span>";
    }

    // Intensität beschreiben
    let intensityText = "Leicht";
    if (maxRain > 0.5) intensityText = "Mäßig";
    if (maxRain > 2.0) intensityText = "Stark";

    // UI befüllen
    document.getElementById('time-window').innerText = `${vonZeit} - ${bisZeit} Uhr`;
    document.getElementById('rain-amount').innerText = `${maxRain.toFixed(1)} mm/h`;
    document.getElementById('intensity').innerText = intensityText;
    
    detailsContainer.style.display = "block";
}

getWeather();
</script>

</body>
</html>
