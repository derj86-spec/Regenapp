<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RainPulse 2h</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-color: #1a1a1e;
            --text-color: #ffffff;
            --text-secondary: #a0a0ab;
            --accent-blue: #38bdf8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-color);
            border-radius: 20px;
            padding: 25px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 { font-size: 1.5rem; margin-top: 0; text-align: center; color: var(--accent-blue); }
        .status-box {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            border-radius: 12px;
            background: rgba(255,255,255,0.03);
            font-size: 1.1rem;
        }
        .details {
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 15px;
            margin-top: 15px;
        }
        .detail-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }
        .detail-item span:first-child { color: var(--text-secondary); }
        .btn {
            width: 100%;
            background: var(--accent-blue);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn:active { opacity: 0.8; }
        .location-info {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 10px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🌧️ RainPulse</h1>
    <div id="status" class="status-box">Ortung wird gestartet...</div>
    
    <div id="details-container" class="details">
        <div class="detail-item"><span id="label-start">Zeitfenster von:</span> <span id="start-time">-</span></div>
        <div class="detail-item"><span id="label-end">Zeitfenster bis:</span> <span id="end-time">-</span></div>
        <div class="detail-item"><span id="label-duration">Status:</span> <span id="duration">-</span></div>
        <div class="detail-item"><span>Intensität (Max):</span> <span id="intensity">-</span></div>
    </div>

    <button class="btn" onclick="getWeather()">Jetzt aktualisieren</button>
    <div id="geo-info" class="location-info">Suche Standort-Signal...</div>
    <div id="update-info" class="location-info" style="color: #4ade80; font-weight: 500;"></div>
</div>

<script>
let updateInterval = null;
let countdownInterval = null;
let letztesWetterData = null;

function getWeather() {
    const statusDiv = document.getElementById('status');
    const geoInfo = document.getElementById('geo-info');

    statusDiv.innerHTML = "🔄 Bestimme Standort...";

    if (!navigator.geolocation) {
        statusDiv.innerHTML = "❌ Ortung wird nicht unterstützt.";
        return;
    }

    navigator.geolocation.getCurrentPosition(
        (position) => {
            const lat = position.coords.latitude.toFixed(4);
            const lon = position.coords.longitude.toFixed(4);
            geoInfo.innerHTML = `📍 GPS: ${lat}, ${lon}`;
            
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=precipitation&timezone=auto&cb=${Date.now()}`;
            
            statusDiv.innerHTML = "📡 Lade Wetterdaten...";

            fetch(url)
                .then(res => {
                    if (!res.ok) throw new Error('API Fehler');
                    return res.json();
                })
                .then(data => {
                    letztesWetterData = data;
                    analyzeHourlyRain();
                    startLiveCountdown();

                    const jetzt = new Date();
                    const zeitStr = jetzt.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    document.getElementById('update-info').innerText = `🔄 Live-Update aktiv (Letzter Check: ${zeitStr})`;
                })
                .catch(err => {
                    statusDiv.innerHTML = "❌ Fehler beim Laden der Wetterdaten.";
                    console.error(err);
                });
        },
        (error) => {
            statusDiv.innerHTML = "❌ Ortung fehlgeschlagen.";
        },
        { enableHighAccuracy: false, timeout: 10000 }
    );
}

function analyzeHourlyRain() {
    const statusDiv = document.getElementById('status');
    const data = letztesWetterData;
    
    if (!data || !data.hourly || !data.hourly.precipitation) {
        statusDiv.innerHTML = "❌ Keine Daten empfangen.";
        return;
    }

    const jetzt = new Date();
    const aktuelleStunde = jetzt.getHours();
    const aktuelleMinute = jetzt.getMinutes();
    
    // Wetter-Werte für die aktuelle Stunde und die nächste Stunde holen
    const rainNow = data.hourly.precipitation[aktuelleStunde] || 0;
    const rainNext = data.hourly.precipitation[aktuelleStunde + 1] || 0;
    const rainInTwoHours = data.hourly.precipitation[aktuelleStunde + 2] || 0;
    
    const maxRain = Math.max(rainNow, rainNext);

    // Helferfunktion zum sauberen Formatieren von Uhrzeiten (HH:MM Uhr)
    const formatUhrzeit = (dateObj) => {
        return dateObj.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + " Uhr";
    };

    // Dynamisches Zeitfenster berechnen: START ist JETZT, ENDE ist JETZT + 2 Stunden
    let startTimeStr = formatUhrzeit(jetzt);
    let zweiStundenSpaeter = new Date(jetzt.getTime() + 2 * 60 * 60 * 1000);
    let endTimeStr = formatUhrzeit(zweiStundenSpaeter);
    
    let durationStr = "";

    if (maxRain === 0) {
        // Fall 1: Komplett trocken
        statusDiv.innerHTML = "☀️ Trocken!<br><span style='font-size:0.9rem; color:#a0a0ab;'>Kein Regen in Sicht.</span>";
        document.getElementById('label-start').innerText = "Zeitfenster von:";
        document.getElementById('label-end').innerText = "Zeitfenster bis:";
        document.getElementById('label-duration').innerText = "Status:";
        durationStr = "Alles trocken";
    } else if (rainNow > 0) {
        // Fall 2: Es regnet aktuell bereits
        statusDiv.innerHTML = "🌧️ Es regnet aktuell!";
        document.getElementById('label-start').innerText = "Zeitfenster von:";
        document.getElementById('label-duration').innerText = "Dauer im Fenster:";
        
        if (rainNext > 0) {
            document.getElementById('label-end').innerText = "Regnet bis mindestens:";
            // Berechne verbleibende Minuten bis zum Ende der nächsten Stunde
            const minVerbleibend = 120 - aktuelleMinute;
            durationStr = `${minVerbleibend} Min. verbleibend`;
        } else {
            document.getElementById('label-end').innerText = "Hört auf um ca.:";
            let endeUhrzeit = new Date();
            endeUhrzeit.setHours(aktuelleStunde + 1, 0, 0, 0);
            endTimeStr = formatUhrzeit(endeUhrzeit);
            
            const minVerbleibend = 60 - aktuelleMinute;
            durationStr = `${minVerbleibend} Min. verbleibend`;
        }
    } else if (rainNext > 0) {
        // Fall 3: Es ist jetzt trocken, fängt aber in der nächsten Stunde an
        statusDiv.innerHTML = "⏳ Regen in Sicht!<br><span style='font-size:0.9rem; color:#a0a0ab;'>Es fängt bald an.</span>";
        document.getElementById('label-start').innerText = "Startet um ca.:";
        document.getElementById('label-end').innerText = "Zeitfenster bis:";
        document.getElementById('label-duration').innerText = "Dauer im Fenster:";
        
        let startUhrzeit = new Date();
        startUhrzeit.setHours(aktuelleStunde + 1, 0, 0, 0);
        startTimeStr = formatUhrzeit(startUhrzeit);
        
        const minBisStart = 60 - aktuelleMinute;
        durationStr = `In ${minBisStart} Min.`;
    }

    let intensityText = "Keiner";
    if (maxRain > 0 && maxRain <= 0.5) intensityText = "Leicht";
    if (maxRain > 0.5 && maxRain <= 2.0) intensityText = "Mäßig";
    if (maxRain > 2.0) intensityText = "Stark";

    // Werte ins UI schreiben
    document.getElementById('start-time').innerText = startTimeStr;
    document.getElementById('end-time').innerText = endTimeStr;
    document.getElementById('duration').innerText = durationStr;
    document.getElementById('intensity').innerText = `${maxRain.toFixed(1)} mm/h (${intensityText})`;
}

function startLiveCountdown() {
    if (countdownInterval) clearInterval(countdownInterval);
    countdownInterval = setInterval(() => {
        if (letztesWetterData) {
            analyzeHourlyRain();
        }
    }, 1000); 
}

getWeather();

if (updateInterval) clearInterval(updateInterval);
updateInterval = setInterval(getWeather, 300000);
</script>

</body>
</html>
